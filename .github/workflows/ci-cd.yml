name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet \
            pytest numpy scipy scikit-learn \
            pymongo requests \
            pydantic python-dotenv

      - name: Run ML service tests
        run: pytest services/ml-service/tests/ -v --tb=short

  build-and-push:
    needs: test
    name: Build & Push — ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: recommendation-service
            context: ./services/recommendation-service
          - name: ml-service
            context: ./services/ml-service
          - name: ai-orchestration
            context: ./services/ai-orchestration
          - name: frontend
            context: ./frontend
            build-args: VITE_API_URL=https://cinescope-backend-t0iu.onrender.com/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cinescope-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/cinescope-${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.build-args || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Render deploys
        run: |
          declare -A hooks=(
            [backend]="${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"
            [recommendation]="${{ secrets.RENDER_DEPLOY_HOOK_RECOMMENDATION }}"
            [ml]="${{ secrets.RENDER_DEPLOY_HOOK_ML }}"
            [ai-orchestration]="${{ secrets.RENDER_DEPLOY_HOOK_AI_ORCHESTRATION }}"
            [frontend]="${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
          )
          for service in "${!hooks[@]}"; do
            hook="${hooks[$service]}"
            if [ -n "$hook" ]; then
              echo "Triggering deploy for $service..."
              curl -s --fail "$hook" | jq -r '.id // "triggered"' || echo "Deploy hook failed for $service"
            else
              echo "No deploy hook set for $service — skipping"
            fi
          done
