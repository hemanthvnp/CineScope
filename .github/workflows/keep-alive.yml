name: Keep Services Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            url: https://cinescope-backend-t0iu.onrender.com/api/health
          - name: recommendation-service
            url: https://cinescope-recommendation-service.onrender.com/health
          - name: ml-service
            url: https://cinescope-ml-service.onrender.com/health
          - name: ai-orchestration
            url: https://cinescope-ai-orchestration.onrender.com/health
          - name: frontend
            url: https://cinescope-frontend-2i07.onrender.com/

    steps:
      - name: Ping ${{ matrix.name }}
        run: |
          curl -sS -o /dev/null -w "${{ matrix.name }}: %{http_code}\n" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            "${{ matrix.url }}"
