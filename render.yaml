services:
  - type: web
    name: cinescope-recommendation-service
    runtime: image
    image:
      url: ghcr.io/hemanthvnp/cinescope-recommendation-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "5001"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: TMDB_API_KEY
        sync: false

  - type: web
    name: cinescope-ml-service
    runtime: image
    image:
      url: ghcr.io/hemanthvnp/cinescope-ml-service:latest
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: MONGO_URI
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: MIN_RATINGS_FOR_COLLAB
        value: "1"
      - key: CONTENT_WEIGHT
        value: "0.75"
      - key: COLLAB_WEIGHT
        value: "0.25"
      - key: DEBUG
        value: "False"

  - type: web
    name: cinescope-backend
    runtime: image
    image:
      url: ghcr.io/hemanthvnp/cinescope-backend:latest
    plan: free
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: RECOMMENDATION_SERVICE_URL
        value: https://cinescope-recommendation-service.onrender.com
      - key: ML_SERVICE_URL
        value: https://cinescope-ml-service.onrender.com
      - key: AI_ORCHESTRATION_URL
        value: https://cinescope-ai-orchestration.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: cinescope-ai-orchestration
    runtime: image
    image:
      url: ghcr.io/hemanthvnp/cinescope-ai-orchestration:latest
    plan: free
    envVars:
      - key: PORT
        value: "9000"
      - key: TMDB_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        value: https://cinescope-ml-service.onrender.com
      - key: RECOMMENDATION_SERVICE_URL
        value: https://cinescope-recommendation-service.onrender.com

  - type: web
    name: cinescope-frontend
    runtime: image
    image:
      url: ghcr.io/hemanthvnp/cinescope-frontend:latest
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://cinescope-backend-t0iu.onrender.com
      - key: BACKEND_HOST
        value: cinescope-backend-t0iu.onrender.com
